global:
  vault:
    url: http://vault:8200
    token: root
  postgres:
    db:
      url: jdbc:postgresql://postgres:5432/demo
      user: demo
      password: demo

deployment:
  replicaCount: 1
  imagePullSecret: regcred
  image:
    repository: example/identityhub
    tag: latest
    pullPolicy: IfNotPresent
  initContainers:
    dependencies: []

service:
  type: ClusterIP
  ports:
    - name: identity
      port: 15151
      targetPort: 15151
    - name: did
      port: 10100
      targetPort: 10100

config:
  env:
    EDC_COMPONENT_ID: "identityhub"
    EDC_HOSTNAME: "ih.example.com"
    EDC_IAM_STS_PRIVATEKEY_ALIAS: "did:web:ih.example.com:identityhub:did#key-1"
    EDC_IAM_STS_PUBLICKEY_ID: "did:web:ih.example.com:identityhub:did#key-1"
    EDC_IH_IAM_ID: "did:web:ih.example.com:identityhub:did"
    EDC_IH_API_SUPERUSER_KEY: "super-key"
    EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/demo"
    EDC_DATASOURCE_DEFAULT_USER: "demo"
    EDC_DATASOURCE_DEFAULT_PASSWORD: "demo"
    EDC_VAULT_HASHICORP_URL: "http://vault:8200"

ingress:
  host: ih.example.com
  tlsSecretName: ih-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  paths:
    - path: /identityhub/identity
      pathType: Prefix
      backend:
        serviceName: demo-identityhub
        servicePort: 15151

ingressDid:
  host: ih.example.com
  tlsSecretName: ih-tls
  paths:
    - path: /identityhub/did
      pathType: Prefix
      backend:
        serviceName: demo-identityhub
        servicePort: 10100
