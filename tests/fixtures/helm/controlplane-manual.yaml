global:
  vault:
    url: http://vault:8200
    token: root
  postgres:
    db:
      url: jdbc:postgresql://postgres:5432/demo
      user: demo
      password: demo

deployment:
  replicaCount: 1
  imagePullSecret: regcred
  image:
    repository: example/controlplane
    tag: latest
    pullPolicy: IfNotPresent
  initContainers:
    dependencies: []

service:
  type: ClusterIP
  ports:
    - name: management
      port: 8181
      targetPort: 8181

config:
  env:
    EDC_COMPONENT_ID: "controlplane"
    EDC_HOSTNAME: "cp.example.com"
    EDC_IAM_ISSUER_ID: "did:web:cp.example.com:identityhub:did"
    WEB_HTTP_MANAGEMENT_AUTH_DAC_KEY_URL: "https://kc.example.com/certs"
    WEB_HTTP_MANAGEMENT_AUTH_KEY: "auth"
    WEB_HTTP_CATALOG_AUTH_DAC_KEY_URL: "https://kc.example.com/certs"
    WEB_HTTP_CATALOG_AUTH_KEY: "auth"
    WEB_HTTP_PARTICIPANT_AUTH_DAC_KEY_URL: "https://kc.example.com/certs"
    WEB_HTTP_PARTICIPANT_AUTH_KEY: "auth"
    EDC_IAM_STS_PRIVATEKEY_ALIAS: "did:web:cp.example.com:identityhub:did#key-1"
    EDC_IAM_STS_PUBLICKEY_ID: "did:web:cp.example.com:identityhub:did#key-1"
    EDC_PARTICIPANT_ID: "did:web:cp.example.com:identityhub:did"
    EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "sts-secret"
    EDC_IAM_STS_OAUTH_CLIENT_ID: "sts-client"
    EDC_IAM_AUTHORITY_ID: "did:web:issuer.example.com:did"
    EDC_DSP_CALLBACK_ADDRESS: "https://cp.example.com/controlplane/dsp/api/dsp"
    EDC_IAM_STS_OAUTH_TOKEN_URL: "http://identityhub:9292/api/sts/token"
    EDC_PARIS_PUBLIC_BASE_URL: "https://paris.example.com"
    EDC_CONTROL_ENDPOINT: "http://controlplane:9191/api/control"
    EDC_USE_CASE_API_BASE_URL: "https://usecase.example.com"
    EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/demo"
    EDC_DATASOURCE_DEFAULT_USER: "demo"
    EDC_DATASOURCE_DEFAULT_PASSWORD: "demo"
    EDC_VAULT_HASHICORP_URL: "http://vault:8200"

ingress:
  host: cp.example.com
  tlsSecretName: cp-manual-tls
  paths:
    - path: /controlplane
      pathType: Prefix
      backend:
        serviceName: demo-controlplane
        servicePort: 8181
