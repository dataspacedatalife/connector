keycloak:
  global:
    imagePullSecrets:
      - name: harbor-regcred-usuarios
    security:
      allowInsecureImages: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak

  extraEnvVars:
    - name: KC_HOSTNAME
      value: "https://kc.example.com"
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      value: "true"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_HTTP_MANAGEMENT_HEALTH_ENABLED
      value: "false"
    - name: KC_LEGACY_OBSERVABILITY_INTERFACE
      value: "true"
    - name: KC_LOG_LEVEL
      value: "info"

  auth:
    adminUser: "admin"
    existingSecret: "keycloak-secrets"
    passwordSecretKey: "admin-password"

  service:
    type: ClusterIP
    ports:
      http: 8080
      https: 8443

  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    requests:
      memory: "1024Mi"
      cpu: "1000m"
    limits:
      memory: "1536Mi"
      cpu: "2000m"

  ingress:
    enabled: true
    hostname: kc.example.com
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    tls: true
    extraTls:
      - hosts:
          - kc.example.com
        secretName: wildcard-tls-cert

  initContainers:
    - name: fetch-themes
      image: harbor.gradiant.org/si-xdatashare-usuarios-pr-01616/keycloak-themes:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e
          echo "[INFO] Copying themes into shared volume..."
          cp -r /themes/cesga /themes-volume/cesga
          echo "[SUCCESS] Themes copied."
      volumeMounts:
        - name: themes-volume
          mountPath: /themes-volume

  extraVolumeMounts:
    - name: themes-volume
      mountPath: /opt/bitnami/keycloak/themes/cesga
      subPath: cesga

  extraVolumes:
    - name: themes-volume
      emptyDir: {}

  postgresql:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
    auth:
      database: "keycloak"
      username: "keycloak"
      existingSecret: "keycloak-secrets"
      secretKeys:
        userPasswordKey: "postgres-password"
    primary:
      persistence:
        enabled: true
        size: 2Gi
        storageClass: openebs-hostpath
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1024Mi"
          cpu: "500m"