      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://blackmesa-postgresql:5432/blackmesa"
      EDC_DATASOURCE_DEFAULT_USER: "blackmesa"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "blackmesa"
      EDC_VAULT_HASHICORP_URL: "http://blackmesa-vault:8200"

