      kubernetes.io/ingress.class: nginx

postgresql:
  image:
    pullPolicy: IfNotPresent
  auth:
    postgresPassword: "blackmesa"
    username: "blackmesa"
    password: "blackmesa"
    database: "blackmesa"
  primary:
    replicaCount: 1
    service:
      ports:
        postgresql: 5432
    resources:
      requests:
        memory: '128Mi'
        cpu: '125m'
      limits:
        memory: '256Mi'
        cpu: '250m'
    persistence:
      enabled: true
      size: "1Gi"
      storageClass: "openebs-hostpath"
      accessModes:
        - ReadWriteOnce

vault:
  injector:
    enabled: false
  server:
    publishNotReadyAddresses: true
    resources:
      requests:
        memory: '512Mi'
        cpu: '250m'
      limits:
        memory: '1Gi'
        cpu: '1000m'
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = 1
          }
          storage "raft" {
            path = "/vault/data"
          }
    dataStorage:
      enabled: true
      size: "2Gi"
      storageClass: "openebs-hostpath"
  ui:
    enabled: true
    service:
      type: ClusterIP
      port: 8200
      targetPort: 8200
      name: blackmesa-vault-ui

oauth2-proxy:
  enable: true
  config:
    clientID: "blackmesa-proxy"
    clientSecret: "8BMrpbo3f7kydPBm7oBlheTiWZrpeZ8M"
    configFile: |
      http_address = "0.0.0.0:4180"
      pass_authorization_header = true
      custom_templates_dir = "/templates"
      
      whitelist_domains = [ 
        "connector.example.com", 
        "kc.example.com"
      ]
      
      email_domains = [ "*" ]
      cookie_refresh = "5m"
      cookie_expire  = "8h"
      
      provider = "keycloak-oidc"
      oidc_issuer_url = "https://kc.example.com/realms/dataspace"
      
      login_url = "https://kc.example.com/realms/dataspace/protocol/openid-connect/auth"
      redeem_url = "https://kc.example.com/realms/dataspace/protocol/openid-connect/token"
      oidc_jwks_url = "https://kc.example.com/realms/dataspace/protocol/openid-connect/certs"
      validate_url = "https://kc.example.com/realms/dataspace/protocol/openid-connect/userinfo"
      skip_oidc_discovery = true
      
      backend_logout_url = "https://kc.example.com/realms/dataspace/protocol/openid-connect/logout?id_token_hint={id_token}"
      redirect_url = "https://connector.example.com/oauth2/callback"
      
      allowed_groups = [ "/blackmesa-group" ]
      skip_provider_button = true
      
      upstreams = [
        "http://blackmesa-participant-portal-service:80/",
        "http://blackmesa-controlplane:8181/api/management/",
        "http://blackmesa-controlplane:17171/api/catalog/",
        "http://blackmesa-controlplane:8081/api/participant/"
      ]

  extraVolumes:
    - name: templates
      configMap:
        name: blackmesa-oauth2-proxy-templates
  extraVolumeMounts:
    - name: templates
      mountPath: "/templates"
      readOnly: true

  service:
    portNumber: 4180

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/pass-authorization-header: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/large-client-header-buffers: "4 16k"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    className: "nginx"
    path: /
    pathType: Prefix
    hosts:
      - "connector.example.com"
    tls:
      - secretName: wildcard-tls-cert
        hosts:
          - "connector.example.com"

