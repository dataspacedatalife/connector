apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identityhub.fullname" . }}-ingress-did
  annotations:
  {{- with .Values.ingressDid.annotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingressDid.className | default "nginx" }}
  rules:
    - host: {{ .Values.ingressDid.host }}
      http:
        paths:
          {{- range .Values.ingressDid.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .backend.service.name | default (include "identityhub.fullname" $) }}
                port:
                  number: {{ .backend.service.port }}
          {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingressDid.host | quote}}
      secretName: {{ .Values.ingressDid.tlsSecretName }}