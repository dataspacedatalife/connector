deployment:
  replicaCount: 1
  imagePullSecrets:
    - name: harbor-regcred-usuarios
  image:
    repository: harbor.gradiant.org/si-xdatashare-usuarios-pr-01616/participant-portal
    tag: "0.7.2"
    pullPolicy: Always

service:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

config:
  env:
    NODE_ENV: "production"
    VITE_ICON_URL: "icons/gradiant.png"
    VITE_DATASPACE_NAME: "OneHealth Dataspace | CESGA"
    VITE_ENABLE_AUDIT: "true"
    VITE_CONNECTOR_CHECK_INTERVAL: "300000"
    VITE_CONNECTOR_TIMEOUT: "15000"
    DEV: "true"
  asset-styles:
    logoUrl: "/icons/csg-logo-big-negativo.png"
    logoIconUrl: "/icons/ces-logo-small-negativo.png"
    backgroundStyle: "solid"
    assetBaseProperties:
      - group: "Contact"
        fields:
          - key: "Name"
            required: true
          - key: "E-mail"
            required: false
          - key: "Phone"
            required: false
      - group: "Data Quality"
        fields:
          - key: "Accuracy"
            required: false
          - key: "Completeness"
            required: false
          - key: "Consistency"
            required: false
          - key: "Timeliness"
            required: false
          - key: "Uniqueness"
            required: false
          - key: "Validity"
            required: false
          - key: "Physiological Coherence"
            required: false
          - key: "Clinical Terminology Adherence Rate"
            required: false
          - key: "Identity Duplication Rate"
            required: false
          - key: "Orphan Records Rate"
            required: false
          - key: "Data Lineage Traceability Index"
            required: false
          - key: "Singling Out Rate"
            required: false
          - key: "Linkability Rate"
            required: false
          - key: "Inference Rate"
            required: false
    theme:
      properties:
        --background: "oklch(98% 0.002 247.839)"
        --foreground: "oklch(21% 0.034 264.665)"
        --card: "oklch(98% 0.002 247.839)"
        --card-foreground: "oklch(21% 0.034 264.665)"
        --popover: "oklch(98% 0.002 247.839)"
        --popover-foreground: "oklch(21% 0.034 264.665)"
        --primary: "oklab(0.63 -0.09 -0.07)"
        --primary-foreground: "oklch(97% 0.014 308.299)"
        --secondary: "oklch(96% 0.003 264.542)"
        --secondary-foreground: "oklch(21% 0.034 264.665)"
        --muted: "oklch(96% 0.003 264.542)"
        --muted-foreground: "oklch(48% 0.02 260)"
        --accent: "oklch(92% 0.006 264.531)"
        --accent-foreground: "oklch(21% 0.034 264.665)"
        --destructive: "oklch(57% 0.245 27.325)"
        --destructive-foreground: "oklch(97% 0.013 17.38)"
        --border: "oklch(92% 0.006 264.531)"
        --input: "oklch(92% 0.006 264.531)"
        --ring: "oklch(63% 0.112 227.4)"
        --radius: "0.625rem"
        --sidebar: "oklab(0.63 -0.09 -0.07)"
        --sidebar-foreground: "oklch(98% 0 0)"
        --sidebar-primary: "oklch(63% 0.112 227.4)"
        --sidebar-primary-foreground: "oklch(97% 0.014 308.299)"
        --sidebar-accent: "oklab(0.53 -0.09 -0.07)"
        --sidebar-accent-foreground: "oklch(98% 0 0)"
        --sidebar-border: "oklab(0.53 -0.09 -0.07)"
        --sidebar-ring: "oklch(63% 0.112 227.4)"
        --gradient-1: "oklab(0.49 -0.06 -0.08)"
        --gradient-2: "oklab(0.63 -0.09 -0.07)"
        --gradient-3: "oklab(0.8  -0.13  0   )"
        --font-body: "'Barlow', sans-serif"
        --font-heading: "'Barlow Condensed', sans-serif"
  tools:
    items:
      - id: "Storage"
        url: "https://nextcloud.srv.cesga.es"
        icon: "data:image/svg+xml;base64,"
        name:
          es: "Storage"
          en: "Storage"
          fr: "Storage"
          de: "Storage"
        external: true

      - id: "Cloud"
        url: "https://cloud.srv.cesga.es/"
        icon: "data:image/svg+xml;base64,"
        name:
          es: "Cloud"
          en: "Cloud"
          fr: "Cloud"
          de: "Cloud"
        external: true

      - id: "HPC"
        url: "https://ondemand.xdatashare.com:3443/"
        icon: "data:image/svg+xml;base64,"
        name:
          es: "HPC"
          en: "HPC"
          fr: "HPC"
          de: "HPC"
        external: true

      - id: "Big Data"
        url: "http://10.38.27.73:9000/login"
        icon: "/icons/earth.png"
        name:
          es: "Big Data"
          en: "Big Data"
          fr: "Big Data"
          de: "Big Data"
        external: true