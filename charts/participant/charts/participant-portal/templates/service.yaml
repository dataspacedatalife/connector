apiVersion: v1
kind: Service
metadata:
  name: {{ include "participant-portal.resourceName" (dict "context" . "suffix" "-service") }}
  labels:
    {{- include "participant-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "participant-portal.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      targetPort: {{ .targetPort }}
      port: {{ .port }}
    {{- end }}