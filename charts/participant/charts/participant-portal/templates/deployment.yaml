apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "participant-portal.fullname" . }}
  labels:
    {{- include "participant-portal.labels" . | nindent 4 }}
{{- $iconUrl := default "" .Values.config.env.VITE_ICON_URL }}
{{- $isRemoteIcon := or (hasPrefix "http://" $iconUrl) (hasPrefix "https://" $iconUrl) }}
{{- $iconFile := "" }}
{{- if and (not $isRemoteIcon) $iconUrl }}
  {{- $iconFile = base $iconUrl }}
{{- end }}
spec:
  replicas: {{ .Values.deployment.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "participant-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "participant-portal.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/tools: {{ include (print $.Template.BasePath "/configmap-tools.yaml") . | sha256sum }}
        checksum/styles: {{ include (print $.Template.BasePath "/configmap-asset-styles.yaml") . | sha256sum }}
    spec:
      {{- if .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.deployment.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "participant-portal.fullname" . }}
          image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "participant-portal.resourceName" (dict "context" . "suffix" "-config") }}
          volumeMounts:
            - name: tools-config
              mountPath: /app/public/tools.json
              subPath: tools.json
              readOnly: true
            - name: asset-styles-config
              mountPath: /app/public/config/config.json
              subPath: config.json
              readOnly: true
            {{- if and (not $isRemoteIcon) $iconUrl }}
            - name: icons-config
              mountPath: /app/public/icons/{{ $iconFile }}
              subPath: {{ $iconFile }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tools-config
          configMap:
            name: {{ include "participant-portal.resourceName" (dict "context" . "suffix" "-tools-config") }}
        - name: asset-styles-config
          configMap:
            name: {{ include "participant-portal.resourceName" (dict "context" . "suffix" "-asset-styles-config") }}
        {{- if and (not $isRemoteIcon) $iconUrl }}
        - name: icons-config
          configMap:
            name: {{ include "participant-portal.resourceName" (dict "context" . "suffix" "-icons-config") }}
        {{- end }}