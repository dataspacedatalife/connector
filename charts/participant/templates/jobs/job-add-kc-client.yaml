{{- if .Values.seeding.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keycloak-seeding
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed-keycloak-client
          image: badouralix/curl-jq:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KC_ADMIN_USER
              value: {{ .Values.seeding.auth.adminUsername | quote }}
            - name: KC_ADMIN_PASSWORD
              value: {{ .Values.seeding.auth.adminPassword | quote }}
            - name: KC_URL
              value: {{ .Values.seeding.keycloakUrl | quote }}
            - name: KC_REALM
              value: {{ .Values.seeding.targetRealm | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: CREATE_DEFAULT_USER
              value: {{ .Values.seeding.defaultUser.create | quote }}
            - name: DEFAULT_USER_PASSWORD
              value: {{ .Values.seeding.defaultUser.password | quote }}
            - name: REALM_ROLES
              value: {{ .Values.seeding.defaultUser.role | quote }}

          command: ["/bin/sh", "-c"]
          args:
            - |
              # ====================================================
              # 1. GET THE ADMIN TOKEN
              # ====================================================
              echo "[INFO] Getting Admin Token..."
              TOKEN=$(curl -s -X POST "$KC_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KC_ADMIN_USER" \
                -d "password=$KC_ADMIN_PASSWORD" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | jq -r '.access_token')

              if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
                echo "[ERROR] Failed to obtain token. Check credentials."
                exit 1
              fi

              # ====================================================
              # 2. CREATE CLIENTS
              # ====================================================
              create_client() {
                local FILE=$1
                echo "[INFO] Creating Client from $FILE..."

                local HTTP_CODE=$(curl -s -o /tmp/client_resp.txt -w "%{http_code}" -X POST "$KC_URL/admin/realms/$KC_REALM/clients" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @$FILE)

                local BODY=$(cat /tmp/client_resp.txt)

                if [ "$HTTP_CODE" -eq 201 ]; then
                   echo "[SUCCESS] Client created successfully."
                elif [ "$HTTP_CODE" -eq 409 ]; then
                   echo "[WARN] Client already exists (HTTP 409). Skipping."
                else
                   echo "[ERROR] Failed to create client. HTTP Code: $HTTP_CODE"
                   echo "[ERROR] Keycloak Response: $BODY"
                   exit 1
                fi
              }

              # Create Proxy Client
              create_client "/payload/proxy-client.json"

              # ====================================================
              # 3. CREATE GROUP
              # ====================================================
              echo "[INFO] Creating Group: ${RELEASE_NAME}-group..."

              GROUP_JSON=$(jq -n --arg name "${RELEASE_NAME}-group" '{"name": $name}')

              HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST "$KC_URL/admin/realms/$KC_REALM/groups" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$GROUP_JSON")

              if [ "$HTTP_CODE" -eq 201 ]; then
                 echo "[SUCCESS] Group created successfully."
              elif [ "$HTTP_CODE" -eq 409 ]; then
                 echo "[WARN] Group already exists (HTTP 409)."
              else
                 echo "[ERROR] Failed to create group. HTTP Code: $HTTP_CODE"
                 exit 1
              fi

              echo "[INFO] Searching for Group ID..."
              RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
                "$KC_URL/admin/realms/$KC_REALM/groups?search=${RELEASE_NAME}-group")

              GROUP_ID=$(echo "$RESPONSE" | jq -r --arg name "${RELEASE_NAME}-group" \
                'if type=="array" then .[] | select(.name == $name) | .id else empty end')

              echo "[INFO] Group ID is: $GROUP_ID"

              # ====================================================
              # 4. CREATE DEFAULT USER AND ASSIGN TO GROUP
              # ====================================================
              if [ "$CREATE_DEFAULT_USER" == "true" ]; then
                echo "[INFO] User creation flag active. Creating User: $RELEASE_NAME..."
                FAKE_EMAIL="${RELEASE_NAME}@example.com"

                USER_JSON=$(jq -n \
                  --arg username "$RELEASE_NAME" \
                  --arg pass "$DEFAULT_USER_PASSWORD" \
                  --arg email "$FAKE_EMAIL" \
                  '{
                    "username": $username,
                    "enabled": true,
                    "email": $email,
                    "emailVerified": true,
                    "firstName": $username,
                    "lastName": $username,
                    "credentials": [{"type": "password", "value": $pass, "temporary": false}]
                  }')

                HTTP_CODE=$(curl -s -o /tmp/user_resp.txt -w "%{http_code}" -X POST "$KC_URL/admin/realms/$KC_REALM/users" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$USER_JSON")

                USER_BODY=$(cat /tmp/user_resp.txt)

                if [ "$HTTP_CODE" -eq 201 ]; then
                   echo "[SUCCESS] User created successfully."
                elif [ "$HTTP_CODE" -eq 409 ]; then
                   echo "[WARN] User already exists (HTTP 409)."
                else
                   echo "[ERROR] Failed to create user. HTTP Code: $HTTP_CODE"
                   echo "[ERROR] Keycloak Error Response: $USER_BODY"
                fi

                # Get the user ID
                USER_ID=$(curl -s -H "Authorization: Bearer $TOKEN" \
                  "$KC_URL/admin/realms/$KC_REALM/users?username=$RELEASE_NAME" | \
                  jq -r --arg name "$RELEASE_NAME" '.[] | select(.username == $name) | .id')

                if [ ! -z "$USER_ID" ] && [ ! -z "$GROUP_ID" ]; then
                  echo "[INFO] Adding User ($USER_ID) to Group ($GROUP_ID)..."
                  curl -s -X PUT "$KC_URL/admin/realms/$KC_REALM/users/$USER_ID/groups/$GROUP_ID" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json"
                  echo "[SUCCESS] User assigned to Group."
                fi

                # ====================================================
                # 5. ASSIGN REALM ROLES TO USER
                # ====================================================
                if [ ! -z "$USER_ID" ]; then
                  ROLES_ARRAY="[]"
                  OLD_IFS="$IFS"
                  IFS=","
                  for ROLE_NAME in $REALM_ROLES; do
                    ROLE_NAME=$(echo "$ROLE_NAME" | tr -d ' ')
                    echo "[INFO] Fetching Role details for Realm Role '$ROLE_NAME'..."
                    ROLE_PAYLOAD=$(curl -s -H "Authorization: Bearer $TOKEN" "$KC_URL/admin/realms/$KC_REALM/roles/$ROLE_NAME")
                    ROLE_ID=$(echo "$ROLE_PAYLOAD" | jq -r '.id')

                    if [ ! -z "$ROLE_ID" ] && [ "$ROLE_ID" != "null" ]; then
                      ROLES_ARRAY=$(echo "$ROLES_ARRAY" | jq --argjson role "$ROLE_PAYLOAD" '. + [$role]')
                      echo "[INFO] Role '$ROLE_NAME' (id: $ROLE_ID) queued for assignment."
                    else
                      echo "[WARN] Realm Role '$ROLE_NAME' not found in realm '$KC_REALM'. Skipping."
                    fi
                  done
                  IFS="$OLD_IFS"
                  if [ "$ROLES_ARRAY" != "[]" ]; then
                    echo "[INFO] Assigning roles to User '$RELEASE_NAME'..."
                    curl -s -X POST "$KC_URL/admin/realms/$KC_REALM/users/$USER_ID/role-mappings/realm" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "$ROLES_ARRAY"
                    echo "[SUCCESS] Realm Roles assigned to User."
                  fi
                fi

              else
                echo "[INFO] User creation flag is disabled. Skipping."
              fi

              echo "[SUCCESS] Keycloak seeding completed."

          volumeMounts:
            - name: payload-volume
              mountPath: /payload
      volumes:
        - name: payload-volume
          configMap:
            name: {{ .Release.Name }}-seeding-payload
  {{- end }}