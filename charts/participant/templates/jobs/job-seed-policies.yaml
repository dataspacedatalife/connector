{{- if .Values.seeding.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-seed-policies"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-controlplane
          image: badouralix/curl-jq:latest
          imagePullPolicy: IfNotPresent
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "[INFO] Waiting for controlplane to be ready..."
              until curl -s --fail "http://{{ .Values.seeding.controlplane.service.observability.name }}:{{ .Values.seeding.controlplane.service.observability.port }}/api/observability/check/health"; do
                echo "[WARN] Controlplane not ready, retrying in 5s..."
                sleep 5
              done
              echo "[SUCCESS] Controlplane is ready!"
      containers:
        - name: seed-policies
          image: badouralix/curl-jq:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[INFO] Starting policy seeding process..."
              for file in /policies/*.json; do
                echo "[INFO] Processing policy file: $file"

                RESPONSE=$(curl -s -w "\n%{http_code}" --location \
                  --request POST "http://{{ .Values.seeding.controlplane.service.management.name }}:{{ .Values.seeding.controlplane.service.management.port }}/api/management/v3/policydefinitions" \
                  --header "Content-Type: application/json" \
                  --header "x-api-key: {{ .Values.seeding.apiKeys.management }}" \
                  --data @"$file")

                HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
                BODY=$(echo "$RESPONSE" | head -n -1)

                if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
                  echo "[SUCCESS] Successfully seeded $file"
                elif [ "$HTTP_CODE" -eq 409 ]; then
                  echo "[WARN] Policy already exists (HTTP 409). Skipping $file."
                else
                  echo "[ERROR] Failed to seed $file. HTTP Code: $HTTP_CODE"
                  echo "[DEBUG] Response: $BODY"
                  exit 1
                fi
              done
              echo "[SUCCESS] Policy seeding completed successfully."
          volumeMounts:
            - name: policies
              mountPath: /policies
      volumes:
        - name: policies
          configMap:
            name: {{ .Release.Name }}-policies
  {{- end }}