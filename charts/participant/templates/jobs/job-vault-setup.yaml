apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-vault-unseal-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-vault-unseal-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vault
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-vault-unseal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-vault-auto-setup-job"
  namespace: {{ .Release.Namespace }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-vault
      restartPolicy: OnFailure
      containers:
        - name: vault-auto-setup
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              VAULT_URL={{ .Values.seeding.vault.url | quote }}
              SECRET_NAME={{ .Values.seeding.vault.secret | quote }}
              NAMESPACE={{ .Release.Namespace }}

              echo "[INFO] Waiting for Vault at $VAULT_URL..."
              until curl -s --connect-timeout 5 $VAULT_URL/v1/sys/health > /dev/null; do
                sleep 5
              done
              echo "[SUCCESS] Vault is online!"

              # --- STEP 1: INITIALIZE ---
              INIT_STATUS=$(curl -s $VAULT_URL/v1/sys/health | jq -r .initialized)

              if [ "$INIT_STATUS" == "false" ]; then
                echo "[INFO] Initializing Vault..."
                INIT_PAYLOAD='{"secret_shares": 1, "secret_threshold": 1}'
                response=$(curl -s -w "\n%{http_code}" --request POST --header "Content-Type: application/json" --data "$INIT_PAYLOAD" $VAULT_URL/v1/sys/init)
                INIT_BODY=$(echo "$response" | head -n -1)
                HTTP_CODE=$(echo "$response" | tail -n 1)

                if [ "$HTTP_CODE" != "200" ]; then
                   echo "[ERROR] INIT FAILED. Response: $INIT_BODY"
                   exit 1
                fi

                ROOT_TOKEN=$(echo $INIT_BODY | jq -r .root_token)
                KEY1=$(echo $INIT_BODY | jq -r '.keys_base64[0]')

                echo "[INFO] Creating Kubernetes secret for Vault tokens..."
                kubectl create secret generic $SECRET_NAME \
                  --from-literal=root_token=$ROOT_TOKEN \
                  --from-literal=unseal_key_1=$KEY1 \
                  -n $NAMESPACE

                echo "[INFO] Waiting for Secret to be created..."
                until kubectl get secret $SECRET_NAME -n $NAMESPACE > /dev/null 2>&1; do
                  sleep 5
                done

                echo "[SUCCESS] Init complete. Keys successfully stored in Kubernetes Secret."
              else
                echo "[INFO] Vault is already initialized. Retrieving credentials..."

                B64_KEY=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.unseal_key_1}' 2>/dev/null)
                B64_TOKEN=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.root_token}' 2>/dev/null)

                KEY1=$(echo "$B64_KEY" | base64 -d 2>/dev/null | tr -d '\n\r')
                ROOT_TOKEN=$(echo "$B64_TOKEN" | base64 -d 2>/dev/null | tr -d '\n\r')

                if [ -z "$KEY1" ]; then
                  echo "[ERROR] The Unseal Key is empty! The Kubernetes Secret may be missing or corrupted."
                  exit 1
                fi
              fi

              # --- STEP 2: UNSEAL VAULT ---
              SEALED=$(curl -s $VAULT_URL/v1/sys/health | jq -r .sealed)

              if [ "$SEALED" == "true" ]; then
                echo "[INFO] Vault is sealed. Unsealing with key..."
                UNSEAL_RESPONSE=$(curl -s -w "\n%{http_code}" --request POST --header "Content-Type: application/json" --data "{\"key\":\"$KEY1\"}" $VAULT_URL/v1/sys/unseal)
              
                UNSEAL_BODY=$(echo "$UNSEAL_RESPONSE" | head -n -1)
                UNSEAL_HTTP=$(echo "$UNSEAL_RESPONSE" | tail -n 1)
              
                if [ "$UNSEAL_HTTP" == "200" ]; then
                  echo "[SUCCESS] Vault unsealed successfully!"
                  sleep 5
                fi

              else
                echo "[INFO] Vault is already unsealed."
              fi

              # --- STEP 3: ENABLE SECRETS ENGINE ---
              echo "[INFO] Configuring Secrets Engine..."
              MOUNTS=$(curl -sSf --header "X-Vault-Token: $ROOT_TOKEN" $VAULT_URL/v1/sys/mounts)
              if echo "$MOUNTS" | grep -q "secret/"; then
                echo "[INFO] Engine 'secret/' already exists. Skipping."
              else
                curl -sSf --header "X-Vault-Token: $ROOT_TOKEN" --request POST --data '{"type": "kv", "options": {"version": "2"}}' $VAULT_URL/v1/sys/mounts/secret > /dev/null
                echo "[SUCCESS] Secret KV Engine Enabled!"
              fi

              echo "[SUCCESS] Vault Auto-Setup Complete!"