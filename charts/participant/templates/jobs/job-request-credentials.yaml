{{- if .Values.seeding.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-request-credential"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-identityhub
          image: badouralix/curl-jq:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "[INFO] Waiting for IdentityHub to be ready..."
              until curl -s --fail "http://{{ .Values.seeding.identityhub.service.observability.name }}:{{ .Values.seeding.identityhub.service.observability.port }}/api/observability/check/health"; do
                echo "[WARN] IdentityHub not ready, retrying in 5s..."
                sleep 5
              done
              echo "[SUCCESS] IdentityHub is ready!"
      containers:
        - name: request-credential
          image: badouralix/curl-jq:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[INFO] Requesting membership credential for {{ .Values.seeding.participant.name }}"
              ENCODED_DID=$(echo -n {{ .Values.seeding.participant.did }} | base64 -w0 | tr -d '=')
              
              RESPONSE=$(curl -s -w "\n%{http_code}" --location \
                --request POST "http://{{ .Values.seeding.identityhub.service.identity.name }}:{{ .Values.seeding.identityhub.service.identity.port }}/api/identity/v1alpha/participants/{{ .Values.seeding.participant.didB64 }}/credentials/request" \
                --header "Content-Type: application/json" \
                --header "x-api-key: {{ .Values.seeding.apiKeys.identityhub }}" \
                --data @- <<EOF
              {
                "issuerDid": {{ .Values.seeding.credentialIssuer.did | quote }},
                "holderPid": {{ .Values.seeding.credentialIssuer.pid | quote }},
                "credentials": [
                  {
                    "format": "VC1_0_JWT",
                    "credentialType": "XDataShareMembershipCredential"
                  }
                ]
              }
              EOF
              )
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
              BODY=$(echo "$RESPONSE" | head -n -1)
              
              if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
                echo "[SUCCESS] Credential requested successfully."
                echo "[DEBUG] Response: $BODY"
              elif [ "$HTTP_CODE" -eq 409 ]; then
                echo "[WARN] Credential already exists (HTTP 409). Skipping."
              elif [ "$HTTP_CODE" -eq 400 ]; then
                echo "[ERROR] Invalid credential request (HTTP 400)."
                echo "[DEBUG] Response: $BODY"
                exit 1
              elif [ "$HTTP_CODE" -eq 401 ] || [ "$HTTP_CODE" -eq 403 ]; then
                echo "[ERROR] Authentication/Authorization failed (HTTP $HTTP_CODE)."
                echo "[DEBUG] Response: $BODY"
                exit 1
              else
                echo "[ERROR] Failed to request credential. HTTP Code: $HTTP_CODE"
                echo "[DEBUG] Response: $BODY"
                exit 1
              fi
{{- end }}
