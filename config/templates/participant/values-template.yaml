global:
  postgres:
    db:
      url: jdbc:postgresql://${PARTICIPANT}-postgresql:5432/${PARTICIPANT}
      name: ${PARTICIPANT}
      user: ${PARTICIPANT}
      password: ${PARTICIPANT}
  vault:
    url: http://${PARTICIPANT}-vault:8200
    token: ${PARTICIPANT}-vault-secret

controlplane:

  config:
    env:
      EDC_COMPONENT_ID: "${PARTICIPANT}-controlplane"
      EDC_HOSTNAME: "${HOST}"
      EDC_IAM_ISSUER_ID: "did:web:${HOST}:identityhub:did"
      WEB_HTTP_MANAGEMENT_AUTH_DAC_KEY_URL: "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/certs"
      WEB_HTTP_MANAGEMENT_AUTH_KEY: "${AUTH_KEY_B64}"
      WEB_HTTP_CATALOG_AUTH_DAC_KEY_URL: "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/certs"
      WEB_HTTP_CATALOG_AUTH_KEY: "${AUTH_KEY_B64}"
      WEB_HTTP_PARTICIPANT_AUTH_DAC_KEY_URL: "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/certs"
      WEB_HTTP_PARTICIPANT_AUTH_KEY: "${AUTH_KEY_B64}"
      EDC_IAM_STS_PRIVATEKEY_ALIAS: "did:web:${HOST}:identityhub:did#key-1"
      EDC_IAM_STS_PUBLICKEY_ID: "did:web:${HOST}:identityhub:did#key-1"
      EDC_PARTICIPANT_ID: "did:web:${HOST}:identityhub:did"
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "did:web:${HOST}:identityhub:did-sts-client-secret"
      EDC_IAM_STS_OAUTH_CLIENT_ID: "did:web:${HOST}:identityhub:did"
      EDC_IAM_AUTHORITY_ID: "did:web:demostrador-datalife.srv.cesga.es:dataspace-issuer:did-publisher"
      EDC_DSP_CALLBACK_ADDRESS: "https://${HOST}/controlplane/dsp/api/dsp"
      EDC_IAM_STS_OAUTH_TOKEN_URL: "http://${PARTICIPANT}-identityhub:9292/api/sts/token"
      EDC_PARIS-PUBLIC_BASE_URL: "https://demostrador-datalife.srv.cesga.es/participant-information-service/participant-public/api/participant-public"
      EDC_CONTROL_ENDPOINT: "http://${PARTICIPANT}-controlplane:9191/api/control"
      EDC_USE-CASE_API_BASE_URL: "https://demostrador-datalife.srv.cesga.es/participant-information-service/use-case/api/use-case"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://${PARTICIPANT}-postgresql:5432/${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_USER: "${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "${PARTICIPANT}"
      EDC_VAULT_HASHICORP_URL: "http://${PARTICIPANT}-vault:8200"
      EDC_OBSERVABILITY_LOKI_URL: "https://xdatashare.srv.cesga.es/audit"
      EDC_OBSERVABILITY_LOKI_API_KEY: "467ifak36snbukd7bget4tg197ejek"
    trustedIssuers:
      - id: "did:web:demostrador-datalife.srv.cesga.es:dataspace-issuer:did-publisher"
        types:
          - "*"

  deployment:
    initContainers:
      dependencies:
        - name: "Postgres"
          host: "${PARTICIPANT}-postgresql"
          port: 5432
        - name: "Identityhub"
          host: "${PARTICIPANT}-identityhub"
          port: "8182"

  ingress:
    host: ${HOST}
    tlsSecretName: ${TLS_SECRET_NAME}
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2

dataplane:

  config:
    env:
      EDC_COMPONENT_ID: "${PARTICIPANT}-dataplane"
      EDC_HOSTNAME: "${HOST}"
      EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "did:web:${HOST}:identityhub:did#key-1"
      EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "did:web:${HOST}:identityhub:did#key-1"
      EDC_DPF_SELECTOR_URL: "http://${PARTICIPANT}-controlplane:9191/api/control/v1/dataplanes"
      EDC_PARTICIPANT_ID: "did:web:${HOST}:identityhub:did"
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "did:web:${HOST}:identityhub:did-sts-client-secret"
      EDC_IAM_STS_OAUTH_CLIENT_ID: "did:web:${HOST}:identityhub:did"
      EDC_IAM_STS_OAUTH_TOKEN_URL: "https://${HOST}/identityhub/sts/api/sts/token"
      EDC_DATAPLANE_API_PUBLIC_BASEURL: "https://${HOST}/dataplane/public/api/public"
      EDC_CONTROL_ENDPOINT: "http://${PARTICIPANT}-dataplane:9191/api/control"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://${PARTICIPANT}-postgresql:5432/${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_USER: "${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "${PARTICIPANT}"
      EDC_VAULT_HASHICORP_URL: "http://${PARTICIPANT}-vault:8200"

  deployment:
    initContainers:
      dependencies:
        - name: "Postgres"
          host: "${PARTICIPANT}-postgresql"
          port: 5432
        - name: "Controlplane"
          host: "${PARTICIPANT}-controlplane"
          port: 9191

  ingress:
    host: ${HOST}
    tlsSecretName: ${TLS_SECRET_NAME}
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2

identityhub:
  config:
    env:
      EDC_COMPONENT_ID: "${PARTICIPANT}-identityhub"
      EDC_HOSTNAME: "${HOST}"
      EDC_IAM_STS_PRIVATEKEY_ALIAS: "did:web:${HOST}:identityhub:did#key-1"
      EDC_IAM_STS_PUBLICKEY_ID: "did:web:${HOST}:identityhub:did#key-1"
      EDC_IH_IAM_ID: "did:web:${HOST}:identityhub:did"
      EDC_IH_API_SUPERUSER_KEY: "${SUPER_USER_KEY_B64}"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://${PARTICIPANT}-postgresql:5432/${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_USER: "${PARTICIPANT}"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "${PARTICIPANT}"
      EDC_VAULT_HASHICORP_URL: "http://${PARTICIPANT}-vault:8200"

  deployment:
    initContainers:
      dependencies:
        - name: "Postgres"
          host: "${PARTICIPANT}-postgresql"
          port: 5432

  ingress:
    host: ${HOST}
    tlsSecretName: ${TLS_SECRET_NAME}
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2

  ingressDid:
    host: ${HOST}
    tlsSecretName: ${TLS_SECRET_NAME}
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"

postgresql:
  image:
    pullPolicy: IfNotPresent
  auth:
    postgresPassword: "${PARTICIPANT}"
    username: "${PARTICIPANT}"
    password: "${PARTICIPANT}"
    database: "${PARTICIPANT}"
  primary:
    replicaCount: 1
    service:
      ports:
        postgresql: 5432
    resources:
      requests:
        memory: '128Mi'
        cpu: '125m'
      limits:
        memory: '256Mi'
        cpu: '250m'
    persistence:
      enabled: true
      size: "1Gi"
      storageClass: "openebs-hostpath"
      accessModes:
        - ReadWriteOnce

vault:
  injector:
    enabled: false
  server:
    publishNotReadyAddresses: true
    resources:
      requests:
        memory: '512Mi'
        cpu: '250m'
      limits:
        memory: '1Gi'
        cpu: '1000m'
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = 1
          }
          storage "raft" {
            path = "/vault/data"
          }
    dataStorage:
      enabled: true
      size: "2Gi"
      storageClass: "openebs-hostpath"
  ui:
    enabled: true
    service:
      type: ClusterIP
      port: 8200
      targetPort: 8200
      name: ${PARTICIPANT}-vault-ui

oauth2-proxy:
  enable: true
  config:
    clientID: "${PARTICIPANT}-proxy"
    clientSecret: "${PARTICIPANT_CLIENT_SECRET}"
    configFile: |
      http_address = "0.0.0.0:4180"
      pass_authorization_header = true
      custom_templates_dir = "/templates"
      
      whitelist_domains = [ 
        "${HOST}", 
        "${HOST_KC}"
      ]
      
      email_domains = [ "*" ]
      cookie_refresh = "5m"
      cookie_expire  = "8h"
      
      provider = "keycloak-oidc"
      oidc_issuer_url = "https://${HOST_KC}/realms/dataspace"
      
      login_url = "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/auth"
      redeem_url = "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/token"
      oidc_jwks_url = "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/certs"
      validate_url = "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/userinfo"
      skip_oidc_discovery = true
      
      backend_logout_url = "https://${HOST_KC}/realms/dataspace/protocol/openid-connect/logout?id_token_hint={id_token}"
      redirect_url = "https://${HOST}/oauth2/callback"
      
      allowed_groups = [ "/${PARTICIPANT}-group" ]
      skip_provider_button = true
      
      upstreams = [
        "http://${PARTICIPANT}-participant-portal-service:80/",
        "http://${PARTICIPANT}-controlplane:8181/api/management/",
        "http://${PARTICIPANT}-controlplane:17171/api/catalog/",
        "http://${PARTICIPANT}-controlplane:8081/api/participant/"
      ]

  extraVolumes:
    - name: templates
      configMap:
        name: ${PARTICIPANT}-oauth2-proxy-templates
  extraVolumeMounts:
    - name: templates
      mountPath: "/templates"
      readOnly: true

  service:
    portNumber: 4180

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/pass-authorization-header: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/large-client-header-buffers: "4 16k"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
    className: "nginx"
    path: /
    pathType: Prefix
    hosts:
      - "${HOST}"
    tls:
      - secretName: ${TLS_SECRET_NAME}
        hosts:
          - "${HOST}"

participant-portal:
  config:
    env:
      VITE_ICON_URL: "${PARTICIPANT_LOGO}"
      VITE_LOGO_ICON_URL: "${PARTICIPANT_LOGO}"
      VITE_DATASPACE_NAME: ""
      VITE_ENABLE_AUDIT: "true"
      VITE_PARIS_URL: "https://demostrador-datalife.srv.cesga.es/participant-information-service"
      VITE_KEYCLOAK_URL: "https://${HOST_KC}"
      VITE_KEYCLOAK_REALM: "dataspace"
      VITE_KEYCLOAK_AUTH_CLIENT_ID: "edc-frontend"
      VITE_EDC_CONNECTOR_ID: "did:web:pharmacy1-dev.srv.cesga.es:identityhub:did"
      VITE_EDC_CONNECTOR_NAME: "${PARTICIPANT}"
      VITE_EDC_CONNECTOR_BASE_URL: "https://${HOST}/"
      VITE_EDC_CONNECTOR_CATALOG_URL: "/api/catalog"
      VITE_EDC_CONNECTOR_MANAGEMENT_URL: "/api/management"
      VITE_EDC_CONNECTOR_PARTICIPANT_URL: "/api/participant"
      VITE_EDC_CONNECTOR_IDENTITY_URL: "https://${HOST}/identityhub/identity/api/identity"
      VITE_EDC_CONNECTOR_PUBLIC_URL: "https://${HOST}/dataplane/public/api/public"
      VITE_EDC_CONNECTOR_AUTH_URL: "https://${HOST}/"
      VITE_SEMANTIC_TREEHOUSE_URL: "https://vocabularyhub.srv.cesga.es/"
      VITE_SEMANTIC_TREEHOUSE_API_KEY: "O5SUglV70VXgFeOCxHVXsYTilecD8Ay2"

seeding:
  enabled: true
  participant:
    url: "https://${HOST}"
    name: ${PARTICIPANT}
    did: "did:web:${HOST}:identityhub:did"
    didB64: "${DID_B64}"
    keyId: "did:web:${HOST}:identityhub:did#key-1"
    privateKeyAlias: "did:web:${HOST}:identityhub:did#key-1"

  credentialIssuer:
    did: "did:web:demostrador-datalife.srv.cesga.es:dataspace-issuer:did-publisher"
    pid: "credential-request-${PARTICIPANT}-1"

  controlplane:
    service:
      observability:
        name: ${PARTICIPANT}-controlplane
        port: 8182
      management:
        name: ${PARTICIPANT}-controlplane
        port: 8181

  identityhub:
    service:
      observability:
        name: ${PARTICIPANT}-identityhub
        port: 8182
      identity:
        name: ${PARTICIPANT}-identityhub
        port: 15151

  vault:
    url: http://${PARTICIPANT}-vault-0.${PARTICIPANT}-vault-internal:8200
    secret: "${PARTICIPANT}-vault-secret"

  serviceEndpoints:
    credentials:
      id: ${PARTICIPANT}-credentialservice-1
      host: "${HOST}/identityhub/credentials"
      name: ${PARTICIPANT}-identityhub
      port: 13131
      didB64: "${DID_B64}"
    controlplane:
      id: ${PARTICIPANT}-dsp
      host: "${HOST}/controlplane/dsp"
      name: ${PARTICIPANT}-controlplane
      port: 8282

  policies:
    - file: files/policies/shared-with-all.json
    - file: files/policies/shared-with-dsga.json

  apiKeys:
    management: "${AUTH_KEY_B64}"
    identityhub: "${SUPER_USER_KEY_B64}"

  keycloakUrl: "https://${HOST_KC}"
  targetRealm: "dataspace"
  postLogoutRedirectUrl: "/oauth2/sign_out?rd=https%3A%2F%2F${HOST_KC}%2Frealms%2Fdataspace%2Fprotocol%2Fopenid-connect%2Flogout%3Fpost_logout_redirect_uri%3Dhttps%3A%2F%2F${HOST}%2F%26client_id%3D${PARTICIPANT}-proxy"
  auth:
    adminUsername: "${KEYCLOAK_ADMIN_USERNAME}"
    adminPassword: "${KEYCLOAK_ADMIN_PASSWORD}"

  client:
    clientId: "${PARTICIPANT}-proxy"
    publicUrl: "https://${HOST}"
    secret: "${PARTICIPANT_CLIENT_SECRET}"
    did: "did:web:${HOST}:identityhub:did"
  defaultUser:
    create: true
    password: "${PASSWORD}"
    role: "edc-admin"
